spring.application.name=baozi-store
server.port=8080

# Banco padrao: H2 salvo em arquivo (./data/baozistore), nao precisa instalar nada.
# Para usar MySQL, rode com o perfil "mysql" (ver application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/baozistore;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Mensagem de erro aparece no JSON (ex.: "Cliente nao encontrado")
server.error.include-message=always
